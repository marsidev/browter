name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Run tests
        run: swift test

      - name: Build universal app bundle
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ./build.sh --universal --no-install --version "$VERSION"

      - name: Package zip and checksum
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="Browter-${VERSION}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Browter.app "build/${ARCHIVE}"
          (cd build && shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256")
          cat "build/${ARCHIVE}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="Browter-${VERSION}-macos.zip"
          gh release create "$RELEASE_TAG" \
            "build/${ARCHIVE}" \
            "build/${ARCHIVE}.sha256" \
            --title "Browter ${RELEASE_TAG}" \
            --generate-notes
